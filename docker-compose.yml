services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: SignalScannerDB
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-SignalScanner}
    ports:
      - "${TIMESCALEDB_BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-SignalScanner}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: SignalScannerRedis
    restart: unless-stopped
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: BE_SignalScanner
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@timescaledb:5432/${POSTGRES_DB:-SignalScanner}
      STREAM_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-'["http://localhost:3000", "http://127.0.0.1:3000"]'}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-signal-scanner-dev-token-2026}
      COLLECTOR_API_KEY: ${COLLECTOR_API_KEY:-collector-dev-key-2026}
      SECRET_KEY: ${SECRET_KEY:-}
      TENANT_SALT: ${TENANT_SALT:-}
      LOCAL_AGENT_TOKEN: ${LOCAL_AGENT_TOKEN:-${NEXT_PUBLIC_LOCAL_COLLECTOR_TOKEN:-signal-scanner-local-agent-token-2026}}
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: Collector_SignalScanner
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      BACKEND_URL: http://backend:8000
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-signal-scanner-dev-token-2026}
      COLLECTOR_API_KEY: ${COLLECTOR_API_KEY:-collector-dev-key-2026}
      SECRET_KEY: ${SECRET_KEY:-}
      TENANT_SALT: ${TENANT_SALT:-}
      LOCAL_AGENT_TOKEN: ${LOCAL_AGENT_TOKEN:-${NEXT_PUBLIC_LOCAL_COLLECTOR_TOKEN:-signal-scanner-local-agent-token-2026}}
      LOCAL_AGENT_HOST: 0.0.0.0
      LOCAL_AGENT_PORT: 8001
    ports:
      - "${COLLECTOR_BIND_IP:-127.0.0.1}:8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_AUTH_TOKEN: ${NEXT_PUBLIC_API_AUTH_TOKEN:-signal-scanner-dev-token-2026}
        NEXT_PUBLIC_LOCAL_COLLECTOR_TOKEN: ${NEXT_PUBLIC_LOCAL_COLLECTOR_TOKEN:-signal-scanner-local-agent-token-2026}
    container_name: FE_SignalScanner
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_API_AUTH_TOKEN: ${NEXT_PUBLIC_API_AUTH_TOKEN:-signal-scanner-dev-token-2026}
      NEXT_PUBLIC_LOCAL_COLLECTOR_TOKEN: ${NEXT_PUBLIC_LOCAL_COLLECTOR_TOKEN:-signal-scanner-local-agent-token-2026}
      INTERNAL_API_URL: http://backend:8000
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      - "${FRONTEND_BIND_IP:-0.0.0.0}:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

volumes:
  timescale_data:
  redis_data:
